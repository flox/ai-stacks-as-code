    "hook": {
      "on-activate": "# Runtime-configurable variables with defaults\nexport JUPYTER_HOST=\"${JUPYTER_HOST:-0.0.0.0}\"\nexport JUPYTER_PORT=\"${JUPYTER_PORT:-8888}\"\nexport JUPYTER_SERVER_TOKEN=\"${JUPYTER_SERVER_TOKEN:-floxfan4evah}\"\nexport NOTEBOOK_DIR=\"${NOTEBOOK_DIR:-$FLOX_ENV_PROJECT}\"\nexport INSTALL_REQUIREMENTS=\"${INSTALL_REQUIREMENTS:-false}\"\n\n# Setup venv\nexport VENV_DIR=\"$FLOX_ENV_CACHE/venv\"\nif [ ! -d \"$VENV_DIR\" ]; then\n    echo \"Creating Python virtual environment...\"\n    python3.13 -m venv \"$VENV_DIR\"\nfi\n\n# Activate venv with guard\nif [ -f \"$VENV_DIR/bin/activate\" ]; then\n    source \"$VENV_DIR/bin/activate\"\n\n    # Install requirements if requested\n    if [ -f \"$FLOX_ENV_PROJECT/requirements.txt\" ] && [ \"$INSTALL_REQUIREMENTS\" = \"true\" ]; then\n        echo \"Installing packages from requirements.txt...\"\n        pip install -r \"$FLOX_ENV_PROJECT/requirements.txt\" --quiet\n    fi\nfi\n\n# Display minimal info — only for interactive shells. Non-interactive\n# activations (the ask-flox MCP server, scripts, CI) stay silent so nothing\n# clutters their output streams. The same details remain available via\n# `jupyter-help`.\nif [ -t 1 ]; then\n    echo \"\"\n    echo \"✅ JupyterLab environment ready (headless mode)\"\n    echo \"\"\n    echo \"Access URL: http://localhost:$JUPYTER_PORT\"\n    echo \"Token: ${JUPYTER_SERVER_TOKEN}\"\n    echo \"\"\n    echo \"Start service: flox activate -s\"\n    echo \"Show help: jupyter-help\"\n    echo \"Documentation: helpf\"\n    echo \"\"\nfi\n\n# Fetch README if missing\n\n  # Fetch README.md if not present\n  README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n  if [ ! -f \"$README_FILE\" ]; then\n    if curl -fsSL https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/jupyterlab-headless/README.md -o \"$README_FILE\" 2>/dev/null; then\n      echo \"✓ Downloaded README.md (use 'helpf' to view)\"\n    fi\n  fi\n\n# Project layout + backend selection (all overridable at activation time).\nexport AI_BRIEF_ROOT=\"$FLOX_ENV_PROJECT\"\nexport SOURCES_DIR=\"${SOURCES_DIR:-$AI_BRIEF_ROOT/sources}\"\nexport WORK_DIR=\"${WORK_DIR:-$AI_BRIEF_ROOT/work}\"\nexport REPORTS_DIR=\"${REPORTS_DIR:-$AI_BRIEF_ROOT/reports}\"\nexport PROMPTS_DIR=\"${PROMPTS_DIR:-$AI_BRIEF_ROOT/prompts}\"\nexport EVALS_DIR=\"${EVALS_DIR:-$AI_BRIEF_ROOT/evals}\"\nexport NOTEBOOKS_DIR=\"${NOTEBOOKS_DIR:-$AI_BRIEF_ROOT/notebooks}\"\nexport PIPELINE_DIR=\"${PIPELINE_DIR:-$AI_BRIEF_ROOT/pipeline}\"\nexport AI_BRIEF_JUSTFILE=\"${AI_BRIEF_JUSTFILE:-$AI_BRIEF_ROOT/justfile}\"\nexport AI_BRIEF_PYTHON=\"${AI_BRIEF_PYTHON:-python3.13}\"\n\n# Backend: honor an explicit AI_BACKEND, else detect (cuda / mps / cpu).\nif [ -z \"${AI_BACKEND:-}\" ]; then\n  if [ \"$(uname -s)\" = \"Darwin\" ] && [ \"$(uname -m)\" = \"arm64\" ]; then\n    AI_BACKEND=\"mps\"\n  elif command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then\n    AI_BACKEND=\"cuda\"\n  else\n    AI_BACKEND=\"cpu\"\n  fi\nfi\nexport AI_BACKEND\n\n# Idempotent project skeleton.\nmkdir -p \"$SOURCES_DIR\" \"$WORK_DIR\" \"$REPORTS_DIR\" \"$PROMPTS_DIR\" \\\n         \"$EVALS_DIR\" \"$NOTEBOOKS_DIR\" \"$PIPELINE_DIR\" 2>/dev/null || true\n\ncd \"$FLOX_ENV_PROJECT\"\n"
    },
    "profile": {
      "bash": "jupyter-help() {\n    echo \"JupyterLab (Headless Mode)\"\n    echo \"\"\n    echo \"Access URL: http://localhost:$JUPYTER_PORT\"\n    echo \"Token: $JUPYTER_SERVER_TOKEN\"\n    echo \"Notebook Dir: $NOTEBOOK_DIR\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  flox activate -s     Start JupyterLab service\"\n    echo \"  flox services status Check service status\"\n    echo \"  pip install <pkg>    Install Python package\"\n    echo \"\"\n    echo \"Runtime Configuration:\"\n    echo \"  JUPYTER_HOST         Default: $JUPYTER_HOST\"\n    echo \"  JUPYTER_PORT         Default: $JUPYTER_PORT\"\n    echo \"  JUPYTER_SERVER_TOKEN Default: (auto-generated)\"\n    echo \"  NOTEBOOK_DIR         Default: $NOTEBOOK_DIR\"\n    echo \"  INSTALL_REQUIREMENTS Default: false\"\n    echo \"\"\n    echo \"Example:\"\n    echo \"  JUPYTER_PORT=9999 JUPYTER_SERVER_TOKEN=mytoken flox activate -s\"\n}\n\n# View environment documentation\n\n  helpf() {\n    local README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n    local README_URL=\"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/jupyterlab-headless/README.md\"\n\n    if [ \"$1\" = \"--help\" ]; then\n      echo \"Usage: helpf [OPTIONS]\"\n      echo \"\"\n      echo \"View environment documentation\"\n      echo \"\"\n      echo \"Options:\"\n      echo \"  --force    Force download fresh copy from GitHub\"\n      echo \"  --help     Show this help message\"\n      echo \"\"\n      echo \"The README is cached locally and only downloaded if missing.\"\n      return 0\n    fi\n\n    if [ \"$1\" = \"--force\" ]; then\n      echo \"Fetching latest README.md from GitHub...\"\n      if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n        echo \"✓ Downloaded README.md\"\n      else\n        echo \"✗ Failed to download README.md\"\n        return 1\n      fi\n    elif [ ! -f \"$README_FILE\" ]; then\n      echo \"README.md not found, downloading...\"\n      if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n        echo \"✓ Downloaded README.md\"\n      else\n        echo \"✗ Failed to download README.md\"\n        return 1\n      fi\n    fi\n\n    if [ -f \"$README_FILE\" ]; then\n      bat --style=auto --paging=always \"$README_FILE\"\n    else\n      echo \"✗ README.md not found at $README_FILE\"\n      return 1\n    fi\n  }\n  export -f helpf\n\n_ai_brief_just() { just --justfile \"${AI_BRIEF_JUSTFILE:-$FLOX_ENV_PROJECT/justfile}\" \"$@\"; }\ningest()    { _ai_brief_just ingest \"$@\"; }\nindex()     { _ai_brief_just index \"$@\"; }\nbrief()     { _ai_brief_just brief \"$@\"; }\nai-eval()   { _ai_brief_just ai-eval \"$@\"; }\nnotebook()  { _ai_brief_just notebook \"$@\"; }\nai-doctor() { _ai_brief_just ai-doctor \"$@\"; }\nmcp()       { _ai_brief_just mcp \"$@\"; }\n",
      "zsh": "jupyter-help() {\n    echo \"JupyterLab (Headless Mode)\"\n    echo \"\"\n    echo \"Access URL: http://localhost:$JUPYTER_PORT\"\n    echo \"Token: $JUPYTER_SERVER_TOKEN\"\n    echo \"Notebook Dir: $NOTEBOOK_DIR\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  flox activate -s     Start JupyterLab service\"\n    echo \"  flox services status Check service status\"\n    echo \"  pip install <pkg>    Install Python package\"\n    echo \"\"\n    echo \"Runtime Configuration:\"\n    echo \"  JUPYTER_HOST         Default: $JUPYTER_HOST\"\n    echo \"  JUPYTER_PORT         Default: $JUPYTER_PORT\"\n    echo \"  JUPYTER_SERVER_TOKEN Default: (auto-generated)\"\n    echo \"  NOTEBOOK_DIR         Default: $NOTEBOOK_DIR\"\n    echo \"  INSTALL_REQUIREMENTS Default: false\"\n    echo \"\"\n    echo \"Example:\"\n    echo \"  JUPYTER_PORT=9999 JUPYTER_SERVER_TOKEN=mytoken flox activate -s\"\n}\n\n# View environment documentation\n\n  helpf() {\n    local README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n    local README_URL=\"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/jupyterlab-headless/README.md\"\n\n    if [ \"$1\" = \"--help\" ]; then\n      echo \"Usage: helpf [OPTIONS]\"\n      echo \"\"\n      echo \"View environment documentation\"\n      echo \"\"\n      echo \"Options:\"\n      echo \"  --force    Force download fresh copy from GitHub\"\n      echo \"  --help     Show this help message\"\n      echo \"\"\n      echo \"The README is cached locally and only downloaded if missing.\"\n      return 0\n    fi\n\n    if [ \"$1\" = \"--force\" ]; then\n      echo \"Fetching latest README.md from GitHub...\"\n      if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n        echo \"✓ Downloaded README.md\"\n      else\n        echo \"✗ Failed to download README.md\"\n        return 1\n      fi\n    elif [ ! -f \"$README_FILE\" ]; then\n      echo \"README.md not found, downloading...\"\n      if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n        echo \"✓ Downloaded README.md\"\n      else\n        echo \"✗ Failed to download README.md\"\n        return 1\n      fi\n    fi\n\n    if [ -f \"$README_FILE\" ]; then\n      bat --style=auto --paging=always \"$README_FILE\"\n    else\n      echo \"✗ README.md not found at $README_FILE\"\n      return 1\n    fi\n  }\n\n_ai_brief_just() { just --justfile \"${AI_BRIEF_JUSTFILE:-$FLOX_ENV_PROJECT/justfile}\" \"$@\"; }\ningest()    { _ai_brief_just ingest \"$@\"; }\nindex()     { _ai_brief_just index \"$@\"; }\nbrief()     { _ai_brief_just brief \"$@\"; }\nai-eval()   { _ai_brief_just ai-eval \"$@\"; }\nnotebook()  { _ai_brief_just notebook \"$@\"; }\nai-doctor() { _ai_brief_just ai-doctor \"$@\"; }\nmcp()       { _ai_brief_just mcp \"$@\"; }\n",
      "fish": "function jupyter-help\n    echo \"JupyterLab (Headless Mode)\"\n    echo \"\"\n    echo \"Access URL: http://localhost:$JUPYTER_PORT\"\n    echo \"Token: $JUPYTER_SERVER_TOKEN\"\n    echo \"Notebook Dir: $NOTEBOOK_DIR\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  flox activate -s     Start JupyterLab service\"\n    echo \"  flox services status Check service status\"\n    echo \"  pip install <pkg>    Install Python package\"\n    echo \"\"\n    echo \"Runtime Configuration:\"\n    echo \"  JUPYTER_HOST         Default: $JUPYTER_HOST\"\n    echo \"  JUPYTER_PORT         Default: $JUPYTER_PORT\"\n    echo \"  JUPYTER_SERVER_TOKEN Default: (auto-generated)\"\n    echo \"  NOTEBOOK_DIR         Default: $NOTEBOOK_DIR\"\n    echo \"  INSTALL_REQUIREMENTS Default: false\"\n    echo \"\"\n    echo \"Example:\"\n    echo \"  JUPYTER_PORT=9999 JUPYTER_SERVER_TOKEN=mytoken flox activate -s\"\nend\n\n# View environment documentationend\n\n  # Fetch README if missing or --force specified\n  if test \"$force_fetch\" = true; or test ! -s \"$README_FILE\"\n    if curl -fsSL \"$README_URL\" -o \"$README_FILE\" 2>/dev/null\n      test \"$force_fetch\" = true; and echo \"README refreshed from $README_URL\"\n    else\n      echo \"Warning: Failed to fetch README from $README_URL\"\n      test ! -s \"$README_FILE\"; and return 1\n    end\n  end\n\n  # Display with bat (if available) or cat\n  if command -v bat >/dev/null 2>&1\n    bat --paging=always \"$README_FILE\"\n  else\n    cat \"$README_FILE\"\n  end\nend\n\nfunction helpf\n    set README_FILE \"$FLOX_ENV_PROJECT/README.md\"\n    set README_URL \"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/jupyterlab-headless/README.md\"\n\n    if test \"$argv[1]\" = \"--help\"\n        echo \"Usage: helpf [OPTIONS]\"\n        echo \"\"\n        echo \"View environment documentation\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --force    Force download fresh copy from GitHub\"\n        echo \"  --help     Show this help message\"\n        echo \"\"\n        echo \"The README is cached locally and only downloaded if missing.\"\n        return 0\n    end\n\n    if test \"$argv[1]\" = \"--force\"\n        echo \"Fetching latest README.md from GitHub...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"\n            echo \"✓ Downloaded README.md\"\n        else\n            echo \"✗ Failed to download README.md\"\n            return 1\n        end\n    else if not test -f \"$README_FILE\"\n        echo \"README.md not found, downloading...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"\n            echo \"✓ Downloaded README.md\"\n        else\n            echo \"✗ Failed to download README.md\"\n            return 1\n        end\n    end\n\n    if test -f \"$README_FILE\"\n        bat --style=auto --paging=always \"$README_FILE\"\n    else\n        echo \"✗ README.md not found at $README_FILE\"\n        return 1\n    end\nend\n\nfunction _ai_brief_just\n    set -l jf \"$FLOX_ENV_PROJECT/justfile\"\n    test -n \"$AI_BRIEF_JUSTFILE\"; and set jf \"$AI_BRIEF_JUSTFILE\"\n    just --justfile \"$jf\" $argv\nend\nfunction ingest;    _ai_brief_just ingest $argv;    end\nfunction index;     _ai_brief_just index $argv;     end\nfunction brief;     _ai_brief_just brief $argv;     end\nfunction ai-eval;   _ai_brief_just ai-eval $argv;   end\nfunction notebook;  _ai_brief_just notebook $argv;  end\nfunction ai-doctor; _ai_brief_just ai-doctor $argv; end\nfunction mcp;       _ai_brief_just mcp $argv;       end\n"
    },
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux",
        "aarch64-darwin"
      ]
    },
    "services": {
      "jupyter-lab": {
        "command": "# Activate venv for user packages\nif [ -f \"$VENV_DIR/bin/activate\" ]; then\n    source \"$VENV_DIR/bin/activate\"\nfi\n\nexec jupyter-lab \\\n  --no-browser \\\n  --ip=\"$JUPYTER_HOST\" \\\n  --port=\"$JUPYTER_PORT\" \\\n  --IdentityProvider.token=\"$JUPYTER_SERVER_TOKEN\" \\\n  --notebook-dir=\"$NOTEBOOK_DIR\"\n"
      }
    },
    "build": {
      "ask-flox": {
        "command": "set -euo pipefail\nmkdir -p \"$out/share/ask-flox\"\ncp -r pipeline \"$out/share/ask-flox/pipeline\"\ncp -r ${assets}/share/ask-flox/index \"$out/share/ask-flox/index\"\ncp ${assets}/share/ask-flox/index-manifest.json \"$out/share/ask-flox/index-manifest.json\"\ncp -r ${assets}/share/ask-flox/model \"$out/share/ask-flox/model\"\n# Launch logic shipped as DATA (mode 644, not under bin/) so Flox won't wrap it.\n# The consuming env installs it onto PATH and runs it with its own python.\ninstall -m644 packaging/ask-flox-mcp \"$out/share/ask-flox/ask-flox-mcp\"\n",
        "sandbox": "pure",
        "version": "0.1.0",
        "description": "Ask Flox: cited retrieval over the Flox docs + blog, served as an MCP tool"
      },
      "assets": {
        "command": "set -euo pipefail\nexport AI_BACKEND=cpu\nexport WORK_DIR=\"$PWD/work\"\nexport HF_HOME=\"$PWD/.hfcache\"\njust ingest corpus\njust index\nmkdir -p \"$out/share/ask-flox\"\ncp -r work/index \"$out/share/ask-flox/index\"\ncp work/index-manifest.json \"$out/share/ask-flox/index-manifest.json\"\ncp -r \"$HF_HOME\" \"$out/share/ask-flox/model\"\n",
        "sandbox": "off"
      }
    }
  },
