schema-version = "1.13.0"

[install]

[vars]

[hook]
on-activate = '''
# Project layout + backend selection (all overridable at activation time).
export AI_BRIEF_ROOT="$FLOX_ENV_PROJECT"
export SOURCES_DIR="${SOURCES_DIR:-$AI_BRIEF_ROOT/sources}"
export WORK_DIR="${WORK_DIR:-$AI_BRIEF_ROOT/work}"
export REPORTS_DIR="${REPORTS_DIR:-$AI_BRIEF_ROOT/reports}"
export PROMPTS_DIR="${PROMPTS_DIR:-$AI_BRIEF_ROOT/prompts}"
export EVALS_DIR="${EVALS_DIR:-$AI_BRIEF_ROOT/evals}"
export NOTEBOOKS_DIR="${NOTEBOOKS_DIR:-$AI_BRIEF_ROOT/notebooks}"
export PIPELINE_DIR="${PIPELINE_DIR:-$AI_BRIEF_ROOT/pipeline}"
export AI_BRIEF_JUSTFILE="${AI_BRIEF_JUSTFILE:-$AI_BRIEF_ROOT/justfile}"
export AI_BRIEF_PYTHON="${AI_BRIEF_PYTHON:-python3.13}"

# Backend: honor an explicit AI_BACKEND, else detect (cuda / mps / cpu).
if [ -z "${AI_BACKEND:-}" ]; then
  if [ "$(uname -s)" = "Darwin" ] && [ "$(uname -m)" = "arm64" ]; then
    AI_BACKEND="mps"
  elif command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
    AI_BACKEND="cuda"
  else
    AI_BACKEND="cpu"
  fi
fi
export AI_BACKEND

# Idempotent project skeleton.
mkdir -p "$SOURCES_DIR" "$WORK_DIR" "$REPORTS_DIR" "$PROMPTS_DIR" \
         "$EVALS_DIR" "$NOTEBOOKS_DIR" "$PIPELINE_DIR" 2>/dev/null || true

cd "$FLOX_ENV_PROJECT"
'''

[profile]
bash = '''
_ai_brief_just() { just --justfile "${AI_BRIEF_JUSTFILE:-$FLOX_ENV_PROJECT/justfile}" "$@"; }
ingest()    { _ai_brief_just ingest "$@"; }
index()     { _ai_brief_just index "$@"; }
brief()     { _ai_brief_just brief "$@"; }
ai-eval()   { _ai_brief_just ai-eval "$@"; }
notebook()  { _ai_brief_just notebook "$@"; }
ai-doctor() { _ai_brief_just ai-doctor "$@"; }
mcp()       { _ai_brief_just mcp "$@"; }
'''
zsh = '''
_ai_brief_just() { just --justfile "${AI_BRIEF_JUSTFILE:-$FLOX_ENV_PROJECT/justfile}" "$@"; }
ingest()    { _ai_brief_just ingest "$@"; }
index()     { _ai_brief_just index "$@"; }
brief()     { _ai_brief_just brief "$@"; }
ai-eval()   { _ai_brief_just ai-eval "$@"; }
notebook()  { _ai_brief_just notebook "$@"; }
ai-doctor() { _ai_brief_just ai-doctor "$@"; }
mcp()       { _ai_brief_just mcp "$@"; }
'''
fish = '''
function _ai_brief_just
    set -l jf "$FLOX_ENV_PROJECT/justfile"
    test -n "$AI_BRIEF_JUSTFILE"; and set jf "$AI_BRIEF_JUSTFILE"
    just --justfile "$jf" $argv
end
function ingest;    _ai_brief_just ingest $argv;    end
function index;     _ai_brief_just index $argv;     end
function brief;     _ai_brief_just brief $argv;     end
function ai-eval;   _ai_brief_just ai-eval $argv;   end
function notebook;  _ai_brief_just notebook $argv;  end
function ai-doctor; _ai_brief_just ai-doctor $argv; end
function mcp;       _ai_brief_just mcp $argv;       end
'''

[services]

## Composed components ------------------------------------------------
[include]
environments = [
    { dir = "envs/ai-base" },
    { dir = "envs/ai-ingest" },
    { dir = "envs/ai-embeddings" },
    { dir = "envs/ai-notebook" },
]

## Packaging ---------------------------------------------------------
## Two-stage build so the published package is self-contained + offline:
##   assets (sandbox=off): rebuild the index from the committed corpus and
##     capture the embedding-model cache — needs network + the composed deps.
##   ask-flox (sandbox=pure): assemble the shippable package from git-tracked
##     code + the baked assets. This is the target you `flox publish`.
[build.assets]
sandbox = "off"
command = '''
set -euo pipefail
export WORK_DIR="$PWD/work"
# Default engine is ONNX (torch-free). Chroma caches its ONNX model under
# $HOME/.cache/chroma; pin HOME here so the download lands where we can grab it.
export HOME="$PWD/.buildhome"
just ingest corpus
just index
mkdir -p "$out/share/ask-flox/onnx-model/all-MiniLM-L6-v2"
cp -r work/index "$out/share/ask-flox/index"
cp work/index-manifest.json "$out/share/ask-flox/index-manifest.json"
# Bake only the extracted model dir (verified to work offline; skips the 79MB tar.gz).
cp -r "$HOME/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx" \
      "$out/share/ask-flox/onnx-model/all-MiniLM-L6-v2/onnx"
'''

[build.ask-flox]
sandbox = "pure"
version = "0.1.0"
description = "Ask Flox: cited retrieval over the Flox docs + blog, served as an MCP tool"
# DATA + CODE package (no executable): ships the prebuilt index, the ONNX
# embedding model, and the server code under $out/share/ask-flox. It deliberately
# ships NO launcher binary — Flox wraps any packaged executable into the build
# environment's closure, which (because the Python deps live in separate
# pkg-groups, not `toplevel`) lacks mcp/chromadb, and `runtime-packages` only
# accepts toplevel-group pkgs. So the CONSUMING env provides python + those deps
# (mcp + chromadb/onnxruntime — no torch) and runs
# $out/share/ask-flox/pipeline/mcp_server.py directly (see envs/ask-flox-demo).
# packaging/ask-flox-mcp is the reference launch logic the wrapper env reuses.
command = '''
set -euo pipefail
mkdir -p "$out/share/ask-flox"
cp -r pipeline "$out/share/ask-flox/pipeline"
cp -r ${assets}/share/ask-flox/index "$out/share/ask-flox/index"
cp ${assets}/share/ask-flox/index-manifest.json "$out/share/ask-flox/index-manifest.json"
cp -r ${assets}/share/ask-flox/onnx-model "$out/share/ask-flox/onnx-model"
# Launch logic shipped as DATA (mode 644, not under bin/) so Flox won't wrap it.
# The consuming env installs it onto PATH and runs it with its own python.
install -m644 packaging/ask-flox-mcp "$out/share/ask-flox/ask-flox-mcp"
'''

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
