    "hook": {
      "on-activate": "# Runtime-configurable variables with defaults\nexport JUPYTER_HOST=\"${JUPYTER_HOST:-0.0.0.0}\"\nexport JUPYTER_PORT=\"${JUPYTER_PORT:-8888}\"\nexport JUPYTER_SERVER_TOKEN=\"${JUPYTER_SERVER_TOKEN:-}\"\nexport NOTEBOOK_DIR=\"${NOTEBOOK_DIR:-$FLOX_ENV_PROJECT}\"\nexport INSTALL_REQUIREMENTS=\"${INSTALL_REQUIREMENTS:-false}\"\n\n# Generate random token if not provided\nif [ -z \"$JUPYTER_SERVER_TOKEN\" ]; then\n    export JUPYTER_SERVER_TOKEN=\"$(openssl rand -hex 32)\"\n    echo \"ℹ️  Generated random token: $JUPYTER_SERVER_TOKEN\"\nfi\n\n# Setup venv\nexport VENV_DIR=\"$FLOX_ENV_CACHE/venv\"\nif [ ! -d \"$VENV_DIR\" ]; then\n    echo \"Creating Python virtual environment...\"\n    python3.13 -m venv \"$VENV_DIR\"\nfi\n\n# Activate venv with guard\nif [ -f \"$VENV_DIR/bin/activate\" ]; then\n    source \"$VENV_DIR/bin/activate\"\n\n    # Install requirements if requested\n    if [ -f \"$FLOX_ENV_PROJECT/requirements.txt\" ] && [ \"$INSTALL_REQUIREMENTS\" = \"true\" ]; then\n        echo \"Installing packages from requirements.txt...\"\n        pip install -r \"$FLOX_ENV_PROJECT/requirements.txt\" --quiet\n    fi\nfi\n\n# Display minimal info\necho \"\"\necho \"✅ JupyterLab environment ready (headless mode)\"\necho \"\"\necho \"Access URL: http://localhost:$JUPYTER_PORT\"\necho \"Token: ${JUPYTER_SERVER_TOKEN}\"\necho \"\"\necho \"Start service: flox activate -s\"\necho \"Show help: jupyter-help\"\necho \"Documentation: helpf\"\necho \"\"\n\n# Fetch README if missing\n\n  # Fetch README.md if not present\n  README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n  if [ ! -f \"$README_FILE\" ]; then\n    if curl -fsSL https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/jupyterlab-headless/README.md -o \"$README_FILE\" 2>/dev/null; then\n      echo \"✓ Downloaded README.md (use 'helpf' to view)\"\n    fi\n  fi\n"
    },
    "profile": {
      "bash": "jupyter-help() {\n    echo \"JupyterLab (Headless Mode)\"\n    echo \"\"\n    echo \"Access URL: http://localhost:$JUPYTER_PORT\"\n    echo \"Token: $JUPYTER_SERVER_TOKEN\"\n    echo \"Notebook Dir: $NOTEBOOK_DIR\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  flox activate -s     Start JupyterLab service\"\n    echo \"  flox services status Check service status\"\n    echo \"  pip install <pkg>    Install Python package\"\n    echo \"\"\n    echo \"Runtime Configuration:\"\n    echo \"  JUPYTER_HOST         Default: $JUPYTER_HOST\"\n    echo \"  JUPYTER_PORT         Default: $JUPYTER_PORT\"\n    echo \"  JUPYTER_SERVER_TOKEN Default: (auto-generated)\"\n    echo \"  NOTEBOOK_DIR         Default: $NOTEBOOK_DIR\"\n    echo \"  INSTALL_REQUIREMENTS Default: false\"\n    echo \"\"\n    echo \"Example:\"\n    echo \"  JUPYTER_PORT=9999 JUPYTER_SERVER_TOKEN=mytoken flox activate -s\"\n}\n\n# View environment documentation\n\n  helpf() {\n    local README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n    local README_URL=\"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/jupyterlab-headless/README.md\"\n\n    if [ \"$1\" = \"--help\" ]; then\n      echo \"Usage: helpf [OPTIONS]\"\n      echo \"\"\n      echo \"View environment documentation\"\n      echo \"\"\n      echo \"Options:\"\n      echo \"  --force    Force download fresh copy from GitHub\"\n      echo \"  --help     Show this help message\"\n      echo \"\"\n      echo \"The README is cached locally and only downloaded if missing.\"\n      return 0\n    fi\n\n    if [ \"$1\" = \"--force\" ]; then\n      echo \"Fetching latest README.md from GitHub...\"\n      if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n        echo \"✓ Downloaded README.md\"\n      else\n        echo \"✗ Failed to download README.md\"\n        return 1\n      fi\n    elif [ ! -f \"$README_FILE\" ]; then\n      echo \"README.md not found, downloading...\"\n      if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n        echo \"✓ Downloaded README.md\"\n      else\n        echo \"✗ Failed to download README.md\"\n        return 1\n      fi\n    fi\n\n    if [ -f \"$README_FILE\" ]; then\n      bat --style=auto --paging=always \"$README_FILE\"\n    else\n      echo \"✗ README.md not found at $README_FILE\"\n      return 1\n    fi\n  }\n  export -f helpf\n",
      "zsh": "jupyter-help() {\n    echo \"JupyterLab (Headless Mode)\"\n    echo \"\"\n    echo \"Access URL: http://localhost:$JUPYTER_PORT\"\n    echo \"Token: $JUPYTER_SERVER_TOKEN\"\n    echo \"Notebook Dir: $NOTEBOOK_DIR\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  flox activate -s     Start JupyterLab service\"\n    echo \"  flox services status Check service status\"\n    echo \"  pip install <pkg>    Install Python package\"\n    echo \"\"\n    echo \"Runtime Configuration:\"\n    echo \"  JUPYTER_HOST         Default: $JUPYTER_HOST\"\n    echo \"  JUPYTER_PORT         Default: $JUPYTER_PORT\"\n    echo \"  JUPYTER_SERVER_TOKEN Default: (auto-generated)\"\n    echo \"  NOTEBOOK_DIR         Default: $NOTEBOOK_DIR\"\n    echo \"  INSTALL_REQUIREMENTS Default: false\"\n    echo \"\"\n    echo \"Example:\"\n    echo \"  JUPYTER_PORT=9999 JUPYTER_SERVER_TOKEN=mytoken flox activate -s\"\n}\n\n# View environment documentation\n\n  helpf() {\n    local README_FILE=\"$FLOX_ENV_PROJECT/README.md\"\n    local README_URL=\"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/jupyterlab-headless/README.md\"\n\n    if [ \"$1\" = \"--help\" ]; then\n      echo \"Usage: helpf [OPTIONS]\"\n      echo \"\"\n      echo \"View environment documentation\"\n      echo \"\"\n      echo \"Options:\"\n      echo \"  --force    Force download fresh copy from GitHub\"\n      echo \"  --help     Show this help message\"\n      echo \"\"\n      echo \"The README is cached locally and only downloaded if missing.\"\n      return 0\n    fi\n\n    if [ \"$1\" = \"--force\" ]; then\n      echo \"Fetching latest README.md from GitHub...\"\n      if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n        echo \"✓ Downloaded README.md\"\n      else\n        echo \"✗ Failed to download README.md\"\n        return 1\n      fi\n    elif [ ! -f \"$README_FILE\" ]; then\n      echo \"README.md not found, downloading...\"\n      if curl -fsSL \"$README_URL\" -o \"$README_FILE\"; then\n        echo \"✓ Downloaded README.md\"\n      else\n        echo \"✗ Failed to download README.md\"\n        return 1\n      fi\n    fi\n\n    if [ -f \"$README_FILE\" ]; then\n      bat --style=auto --paging=always \"$README_FILE\"\n    else\n      echo \"✗ README.md not found at $README_FILE\"\n      return 1\n    fi\n  }\n",
      "fish": "function jupyter-help\n    echo \"JupyterLab (Headless Mode)\"\n    echo \"\"\n    echo \"Access URL: http://localhost:$JUPYTER_PORT\"\n    echo \"Token: $JUPYTER_SERVER_TOKEN\"\n    echo \"Notebook Dir: $NOTEBOOK_DIR\"\n    echo \"\"\n    echo \"Commands:\"\n    echo \"  flox activate -s     Start JupyterLab service\"\n    echo \"  flox services status Check service status\"\n    echo \"  pip install <pkg>    Install Python package\"\n    echo \"\"\n    echo \"Runtime Configuration:\"\n    echo \"  JUPYTER_HOST         Default: $JUPYTER_HOST\"\n    echo \"  JUPYTER_PORT         Default: $JUPYTER_PORT\"\n    echo \"  JUPYTER_SERVER_TOKEN Default: (auto-generated)\"\n    echo \"  NOTEBOOK_DIR         Default: $NOTEBOOK_DIR\"\n    echo \"  INSTALL_REQUIREMENTS Default: false\"\n    echo \"\"\n    echo \"Example:\"\n    echo \"  JUPYTER_PORT=9999 JUPYTER_SERVER_TOKEN=mytoken flox activate -s\"\nend\n\n# View environment documentationend\n\n  # Fetch README if missing or --force specified\n  if test \"$force_fetch\" = true; or test ! -s \"$README_FILE\"\n    if curl -fsSL \"$README_URL\" -o \"$README_FILE\" 2>/dev/null\n      test \"$force_fetch\" = true; and echo \"README refreshed from $README_URL\"\n    else\n      echo \"Warning: Failed to fetch README from $README_URL\"\n      test ! -s \"$README_FILE\"; and return 1\n    end\n  end\n\n  # Display with bat (if available) or cat\n  if command -v bat >/dev/null 2>&1\n    bat --paging=always \"$README_FILE\"\n  else\n    cat \"$README_FILE\"\n  end\nend\n\nfunction helpf\n    set README_FILE \"$FLOX_ENV_PROJECT/README.md\"\n    set README_URL \"https://raw.githubusercontent.com/barstoolbluz/floxenvs/main/jupyterlab-headless/README.md\"\n\n    if test \"$argv[1]\" = \"--help\"\n        echo \"Usage: helpf [OPTIONS]\"\n        echo \"\"\n        echo \"View environment documentation\"\n        echo \"\"\n        echo \"Options:\"\n        echo \"  --force    Force download fresh copy from GitHub\"\n        echo \"  --help     Show this help message\"\n        echo \"\"\n        echo \"The README is cached locally and only downloaded if missing.\"\n        return 0\n    end\n\n    if test \"$argv[1]\" = \"--force\"\n        echo \"Fetching latest README.md from GitHub...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"\n            echo \"✓ Downloaded README.md\"\n        else\n            echo \"✗ Failed to download README.md\"\n            return 1\n        end\n    else if not test -f \"$README_FILE\"\n        echo \"README.md not found, downloading...\"\n        if curl -fsSL \"$README_URL\" -o \"$README_FILE\"\n            echo \"✓ Downloaded README.md\"\n        else\n            echo \"✗ Failed to download README.md\"\n            return 1\n        end\n    end\n\n    if test -f \"$README_FILE\"\n        bat --style=auto --paging=always \"$README_FILE\"\n    else\n        echo \"✗ README.md not found at $README_FILE\"\n        return 1\n    end\nend\n"
    },
