schema-version = "1.13.0"

## ai-orchestration — Temporal SDK + local dev server for the ask-flox
## durable ingestion/publication pipeline. Single-responsibility component,
## composed into the top-level ai-brief environment via [include].

[install]
temporalio.pkg-path = "python313Packages.temporalio"   # Temporal Python SDK
temporal-cli.pkg-path = "temporal-cli"                  # server (start-dev) + CLI + Web UI

[vars]
ENV_NAME = "ai-orchestration"

[hook]
on-activate = '''
# --- Orchestration config (all overridable at activation time) -------------
# Durable local state: artifact store, per-candidate work, Temporal dev DB, logs.
export AI_BRIEF_STATE_DIR="${AI_BRIEF_STATE_DIR:-$FLOX_ENV_PROJECT/state}"
export AI_BRIEF_STORE_DIR="${AI_BRIEF_STORE_DIR:-$AI_BRIEF_STATE_DIR/store}"
export AI_BRIEF_LOG_DIR="${AI_BRIEF_LOG_DIR:-$AI_BRIEF_STATE_DIR/logs}"

# Temporal connection — client and worker read these.
export TEMPORAL_IP="${TEMPORAL_IP:-127.0.0.1}"
export TEMPORAL_PORT="${TEMPORAL_PORT:-7233}"
export TEMPORAL_UI_PORT="${TEMPORAL_UI_PORT:-8233}"
export TEMPORAL_ADDRESS="${TEMPORAL_ADDRESS:-$TEMPORAL_IP:$TEMPORAL_PORT}"
export TEMPORAL_NAMESPACE="${TEMPORAL_NAMESPACE:-default}"
export TEMPORAL_TASK_QUEUE="${TEMPORAL_TASK_QUEUE:-ask-flox-pipeline}"

# Upstream source repos for the two content sources (local clones by default;
# override to point at fresh checkouts). The pipeline resolves each to a pinned
# commit before ingestion — see orchestrator/snapshot.py.
export ASK_FLOX_DOCS_REPO="${ASK_FLOX_DOCS_REPO:-$HOME/dev/flox-docs}"
export ASK_FLOX_BLOG_REPO="${ASK_FLOX_BLOG_REPO:-$HOME/dev/floxwebsite}"

# Make the orchestrator package importable (python -m orchestrator.*).
export PYTHONPATH="$FLOX_ENV_PROJECT${PYTHONPATH:+:$PYTHONPATH}"

mkdir -p "$AI_BRIEF_STATE_DIR/temporal" "$AI_BRIEF_STORE_DIR" "$AI_BRIEF_LOG_DIR" 2>/dev/null || true
'''

[services]
# Local Temporal dev server with a persistent SQLite history so workflows
# survive worker restarts (required for the crash/resume + durable-review demos).
temporal-dev.command = '''
exec temporal server start-dev \
  --ip "$TEMPORAL_IP" \
  --port "$TEMPORAL_PORT" \
  --ui-port "$TEMPORAL_UI_PORT" \
  --db-filename "$AI_BRIEF_STATE_DIR/temporal/dev.db" \
  --log-format pretty 2>&1 | tee -a "$AI_BRIEF_LOG_DIR/temporal-dev.log"
'''

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
