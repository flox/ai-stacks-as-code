{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.13.0",
    "install": {
      "temporal-cli": {
        "pkg-path": "temporal-cli"
      },
      "temporalio": {
        "pkg-path": "python313Packages.temporalio"
      }
    },
    "vars": {
      "ENV_NAME": "ai-orchestration"
    },
    "hook": {
      "on-activate": "# --- Orchestration config (all overridable at activation time) -------------\n# Durable local state: artifact store, per-candidate work, Temporal dev DB, logs.\nexport AI_BRIEF_STATE_DIR=\"${AI_BRIEF_STATE_DIR:-$FLOX_ENV_PROJECT/state}\"\nexport AI_BRIEF_STORE_DIR=\"${AI_BRIEF_STORE_DIR:-$AI_BRIEF_STATE_DIR/store}\"\nexport AI_BRIEF_LOG_DIR=\"${AI_BRIEF_LOG_DIR:-$AI_BRIEF_STATE_DIR/logs}\"\n\n# Temporal connection — client and worker read these.\nexport TEMPORAL_IP=\"${TEMPORAL_IP:-127.0.0.1}\"\nexport TEMPORAL_PORT=\"${TEMPORAL_PORT:-7233}\"\nexport TEMPORAL_UI_PORT=\"${TEMPORAL_UI_PORT:-8233}\"\nexport TEMPORAL_ADDRESS=\"${TEMPORAL_ADDRESS:-$TEMPORAL_IP:$TEMPORAL_PORT}\"\nexport TEMPORAL_NAMESPACE=\"${TEMPORAL_NAMESPACE:-default}\"\nexport TEMPORAL_TASK_QUEUE=\"${TEMPORAL_TASK_QUEUE:-ask-flox-pipeline}\"\n\n# Upstream source repos for the two content sources (local clones by default;\n# override to point at fresh checkouts). The pipeline resolves each to a pinned\n# commit before ingestion — see orchestrator/snapshot.py.\nexport ASK_FLOX_DOCS_REPO=\"${ASK_FLOX_DOCS_REPO:-$HOME/dev/flox-docs}\"\nexport ASK_FLOX_BLOG_REPO=\"${ASK_FLOX_BLOG_REPO:-$HOME/dev/floxwebsite}\"\n\n# Make the orchestrator package importable (python -m orchestrator.*).\nexport PYTHONPATH=\"$FLOX_ENV_PROJECT${PYTHONPATH:+:$PYTHONPATH}\"\n\nmkdir -p \"$AI_BRIEF_STATE_DIR/temporal\" \"$AI_BRIEF_STORE_DIR\" \"$AI_BRIEF_LOG_DIR\" 2>/dev/null || true\n"
    },
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux",
        "aarch64-darwin"
      ]
    },
    "services": {
      "temporal-dev": {
        "command": "exec temporal server start-dev \\\n  --ip \"$TEMPORAL_IP\" \\\n  --port \"$TEMPORAL_PORT\" \\\n  --ui-port \"$TEMPORAL_UI_PORT\" \\\n  --db-filename \"$AI_BRIEF_STATE_DIR/temporal/dev.db\" \\\n  --log-format pretty 2>&1 | tee -a \"$AI_BRIEF_LOG_DIR/temporal-dev.log\"\n"
      }
    }
  },
