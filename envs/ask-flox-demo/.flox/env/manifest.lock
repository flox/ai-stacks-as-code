    "schema-version": "1.13.0",
    "install": {
      "ask-flox": {
        "pkg-path": "flox-labs/ask-flox",
        "pkg-group": "ask-flox"
      },
      "chromadb": {
        "pkg-path": "python313Packages.chromadb",
        "pkg-group": "chromadb",
        "outputs": "all"
      },
      "claude-code": {
        "pkg-path": "flox/claude-code",
