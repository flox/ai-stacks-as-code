        "outputs": "all"
      },
      "python3": {
        "pkg-path": "python3",
        "outputs": "all"
      }
    },
    "hook": {
      "on-activate": "# Put the packaged launcher on PATH (stages the read-only index to a writable\n# cache, forces offline, runs the stdio server with this env's python).\nmkdir -p \"$FLOX_ENV_CACHE/bin\"\ninstall -m755 \"$FLOX_ENV/share/ask-flox/ask-flox-mcp\" \"$FLOX_ENV_CACHE/bin/ask-flox-mcp\"\nexport PATH=\"$FLOX_ENV_CACHE/bin:$PATH\"\n\n# MCP config for Claude Code, exposed via the `ask-flox` alias below.\ncat > \"$FLOX_ENV_CACHE/ask-flox.mcp.json\" <<EOF\n{ \"mcpServers\": { \"ask-flox\": { \"command\": \"ask-flox-mcp\" } } }\nEOF\n"
    },
    "profile": {
      "bash": "alias ask-flox='claude --mcp-config \"$FLOX_ENV_CACHE/ask-flox.mcp.json\"'\n",
      "zsh": "alias ask-flox='claude --mcp-config \"$FLOX_ENV_CACHE/ask-flox.mcp.json\"'\n",
      "fish": "alias ask-flox 'claude --mcp-config \"$FLOX_ENV_CACHE/ask-flox.mcp.json\"'\n"
    },
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux",
        "aarch64-darwin"
      ]
    }
  },
